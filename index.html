<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calorie Tracker</title>
<meta name="theme-color" content="#f5f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calories">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script async src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
:root{
  --bg:#f5f3ee;--card:#fff;--ink:#1c1e1b;--muted:#6f726b;--line:#e7e3da;
  --accent:#2f7d4f;--accent-ink:#fff;--accent-soft:#e4f1e7;
  --p:#d4623a;--c:#d99a1e;--f:#4479b3;--over:#c4412f;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;color:var(--muted)}
.datenav button:active{background:var(--line)}
#dateLbl{font-weight:800;font-size:20px;min-width:120px;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.summary{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1}
.ring .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.stats{flex:1;min-width:0}
.statline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
.statline b{color:var(--ink);font-size:15px;display:block}
.macro{margin-top:9px}
.macro .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.macro .top span:first-child{font-weight:700}
.macro .top span:last-child{color:var(--muted)}
.bar{height:7px;background:#efece5;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.meal h3{display:flex;align-items:center;justify-content:space-between;margin:0;font-size:16px}
.meal h3 .kc{font-weight:600;color:var(--muted);font-size:13.5px;margin-left:auto;margin-right:8px}
.addmini{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:700;line-height:1}
.entries{margin-top:8px}
.entry{display:flex;width:100%;text-align:left;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .nm small{color:var(--muted)}
.entry .k{font-weight:700;white-space:nowrap}
.emptymeal{color:var(--muted);font-size:13px;margin:8px 0 0}
.week h3{margin:0 0 12px;font-size:16px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;position:relative}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--accent);min-height:3px}
.bars .b.over{background:var(--over)}
.bars .b.zero{background:var(--line)}
.bars .d{font-size:11px;color:var(--muted);margin-top:5px}
.bars .col.sel .d{color:var(--ink);font-weight:800}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed #c9c4b8;pointer-events:none}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 35%)}
.bottom .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.bigbtn{flex:1;height:54px;border-radius:15px;font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:9px}
.bigbtn.dark{background:var(--ink);color:#fff}
.bigbtn.acc{background:var(--accent);color:#fff}
.bigbtn:active,.cta:active,.tile:active{transform:scale(.98)}
.localnote{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0}
/* sheet */
#backdrop{position:fixed;inset:0;background:rgba(20,22,18,.42);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:center}
#sheetBody{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
[hidden]{display:none!important}
.sh-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sh-top h2{margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x,.back{width:36px;height:36px;border-radius:50%;background:#f0ede6;font-size:16px;flex:none;display:grid;place-items:center}
.back{font-size:24px;line-height:1;padding-bottom:3px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.chip{padding:7px 13px;border-radius:999px;background:#f0ede6;font-weight:600;font-size:13.5px}
.chip.on{background:var(--ink);color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;gap:10px;font-weight:700;text-align:left;background:var(--card)}
.tile.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.tile.wide{width:100%;margin:4px 0 14px;justify-content:center}
.tile[disabled]{opacity:.6}
.search input,.form input,.grams input,.manual input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fbfaf7;outline:none}
.search input:focus,.form input:focus,.grams input:focus,.manual input:focus{border-color:var(--accent);background:#fff}
.sec{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.row{display:flex;width:100%;text-align:left;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row div{flex:1;min-width:0}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--muted);font-size:12.5px}
.row .kc{font-weight:700;white-space:nowrap;text-align:right;font-size:14px}
.row .kc small{display:block;font-weight:500}
.row.ai{background:var(--accent-soft);border-radius:12px;padding:12px;border:0;margin-top:10px;color:var(--accent)}
.row.ai b{color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.sub{margin:-8px 0 8px;color:var(--muted)}
.per{background:#f6f4ef;border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted);margin:0 0 14px}
.per b{color:var(--ink)}
.grams{display:flex;align-items:center;gap:10px}
.grams input{font-size:28px;font-weight:800;padding:10px 14px}
.grams span{font-weight:700;color:var(--muted);font-size:17px}
.result{display:flex;gap:8px;margin:14px 0 4px}
.result div{flex:1;background:#f6f4ef;border-radius:12px;padding:10px 6px;text-align:center}
.result b{display:block;font-size:19px}
.result small{color:var(--muted);font-size:12px}
.result .kcal{background:var(--accent-soft)}
.result .kcal b{color:var(--accent);font-size:22px}
.btns{display:flex;gap:10px;margin-top:14px}
.cta{flex:1;height:52px;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:16px}
.ghost{height:52px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);font-weight:700}
.ghost.danger{color:var(--over)}
.link{display:block;margin:14px auto 0;color:var(--muted);text-decoration:underline;font-size:13.5px}
.form label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
.form label input{margin-top:5px;color:var(--ink);font-weight:500}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{background:var(--accent-soft);color:#1f4d31;border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:10px;line-height:1.45}
.note.warn{background:#fbeee6;color:#7a3417}
.loading{text-align:center;padding:40px 0 30px;color:var(--muted)}
.spin{width:34px;height:34px;border:3.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.manual{display:flex;gap:8px;margin-top:10px}
.manual button{flex:none;padding:0 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#scanner{position:fixed;inset:0;background:#000;z-index:30}
#scanVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;left:50%;top:42%;width:min(82vw,420px);height:min(42vw,210px);transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);border:3px solid #fff}
.scanframe::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ff5a3c;box-shadow:0 0 12px #ff5a3c;animation:scanl 1.6s ease-in-out infinite alternate}
@keyframes scanl{from{transform:translateY(-60px)}to{transform:translateY(60px)}}
.scantop{position:relative;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;color:#fff}
.scantop .x{background:rgba(255,255,255,.18);color:#fff}
#scanMsg{position:absolute;left:0;right:0;top:calc(42% + min(21vw,105px) + 18px);text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 6px #000}
.scanbtm{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);display:flex;gap:10px}
.scanbtm button{flex:1;height:50px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;backdrop-filter:blur(8px)}
.boot{padding:80px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

    <div class="datenav">

    </div>
    <button class="iconbtn" id="settingsBtn" aria-label="Goals and settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>
  <main id="main"><div class="boot"><div class="spin"></div>Loading your log…</div></main>
</div>

<div class="bottom"><div class="in">

    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
    Scan barcode</button>
  <button class="bigbtn acc" id="addMain">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Add food</button>
</div></div>

<input type="file" id="scanIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>
<div id="scanner" hidden>
  <video id="scanVideo" playsinline muted autoplay></video>
  <div class="scanframe"></div>
  <div class="scantop"><b style="font-size:17px">Scan barcode</b><button class="x" id="scanClose" aria-label="Close">✕</button></div>
  <div id="scanMsg">Starting camera…</div>
  <div class="scanbtm"><button id="scanPhoto">Use a photo</button><button id="scanType">Type number</button></div>
</div>
<div id="backdrop" hidden></div>
<div id="sheet" hidden><div id="sheetBody"></div></div>
<div id="toast"></div>

const store = {
  async get(k) { try { const v = localStorage.getItem('ct:' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) {
    try { localStorage.setItem('ct:' + k, JSON.stringify(v)); }
    catch (e) { toast('Storage is full — export a backup and delete old foods'); }
    return Promise.resolve();
  }
};

const saveFoods = () => store.set('foods', { items: S.foods });
const saveDay = k => store.set('day-' + k, S.days[k]);

async function ensureDay(k) {
  if (!S.days[k]) { const d = await store.get('day-' + k); S.days[k] = d && Array.isArray(d.entries) ? d : { entries: [] }; }
  return S.days[k];
}
async function gotoDate(d) {
  S.date = d; S.key = dkey(d);
  await Promise.all(Array.from({ length: 7 }, (_, i) => ensureDay(dkey(addDays(d, -i)))));
  render();
}

}

        <div class="mid"><div class="big" style="${over ? 'color:var(--over)' : ''}">${Math.abs(Math.round(left))}</div><div class="lbl">${over ? 'kcal over' : 'kcal left'}</div></div>

`;
}

/* ---------- barcode scanning ---------- */
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => res({ img, url }); img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
function drawScaled(img, max, rot) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight, s = Math.min(1, max / Math.max(w0, h0));
  const w = Math.round(w0 * s), h = Math.round(h0 * s);
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
  if (rot) { cv.width = h; cv.height = w; ctx.translate(h / 2, w / 2); ctx.rotate(rot * Math.PI / 180); ctx.drawImage(img, -w / 2, -h / 2, w, h); }
  else { cv.width = w; cv.height = h; ctx.drawImage(img, 0, 0, w, h); }
  return cv;
}
async function waitForZXing(ms = 6000) { const t0 = Date.now(); while (!window.ZXing && Date.now() - t0 < ms) await new Promise(r => setTimeout(r, 150)); return window.ZXing; }
async function decodeBarcode(file) {
  const { img, url } = await loadImage(file);
  try {
    if ('BarcodeDetector' in window) {
      try {
        const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'] });
        const r = await det.detect(img); if (r && r.length) return r[0].rawValue;
      } catch (e) {}
    }
    const Z = await waitForZXing(); if (!Z) return null;
    const F = Z.BarcodeFormat, hints = new Map();
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF]);
    const reader = new Z.MultiFormatReader();
    for (const max of [1280, 800, 1900]) for (const rot of [0, 90]) {
      try {
        const cv = drawScaled(img, max, rot);
        const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)));
        const res = reader.decode(bmp, hints);
        if (res) return res.getText();
      } catch (e) { /* not found at this size/angle */ }
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}
const normCode = c => String(c || '').replace(/\D/g, '').replace(/^0+/, '');
async function handleBarcode(code) {
  code = String(code).replace(/\s/g, '');
  openSheet();
  const f = Object.values(S.foods).find(x => x.barcode && normCode(x.barcode) === normCode(code));
  if (f) { toast('Found: ' + f.name); viewGrams(f); return; }
  loadingView('Looking up ' + code + '…');
  const after = 'It’s saved after this, so next time this barcode fills in instantly.';
  try {
    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 9000);
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,brands,nutriments,serving_quantity,serving_size`, { signal: ctrl.signal });
    clearTimeout(tm);
    const j = await r.json();
    if (j && j.status === 1 && j.product) {
      const p = j.product, n = p.nutriments || {};
      const name = String(p.product_name_en || p.product_name || '').trim();
      const brand = String(p.brands || '').split(',')[0].trim();
      let kcal = n['energy-kcal_100g'];
      if (kcal == null && n['energy_100g'] != null) kcal = n['energy_100g'] / 4.184;
      if (kcal != null && isFinite(+kcal)) {
        const sq = num(p.serving_quantity);
        const food = {
          id: newId(), name: name || 'Product ' + code, brand,
          kcal: Math.round(num(kcal) * 10) / 10, p: num(n.proteins_100g), c: num(n.carbohydrates_100g), f: num(n.fat_100g),
          serving_g: sq > 0 ? sq : null, serving_label: sq > 0 ? `1 serving (${p.serving_size || r1(sq) + ' g'})` : null,
          barcode: code, lastUsed: Date.now()
        };
        S.foods[food.id] = food; saveFoods();
        toast('Found: ' + food.name); viewGrams(food); return;
      }
      viewFoodForm({ barcode: code, name, brand }, `Found <b>${esc(name || code)}</b>, but the database has no nutrition numbers for it. Enter them from the label once. ${after}`);
      return;
    }
    viewFoodForm({ barcode: code }, `Product <b>${esc(code)}</b> isn’t in the database yet. Enter the numbers from its nutrition label once. ${after}`);
  } catch (e) {
    viewFoodForm({ barcode: code }, `Couldn’t reach the food database (are you offline?). Enter the numbers from the label for <b>${esc(code)}</b>. ${after}`, true);
  }
}

/* ---------- live camera scanner ---------- */
let scanStream = null, scanTimer = null, scanBusy = false, zx = null;
const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'];
function zxDecodeVideo(v) {
  const Z = window.ZXing; if (!Z) return null;
  if (!zx) {
    const F = Z.BarcodeFormat, hints = new Map();
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF]);
    zx = { reader: new Z.MultiFormatReader(), hints, cv: document.createElement('canvas') };
  }
  const vw = v.videoWidth, vh = v.videoHeight; if (!vw || !vh) return null;
  const sw = vw * 0.9, sh = vh * 0.55, sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  const scale = Math.min(1, 900 / sw);
  zx.cv.width = Math.round(sw * scale); zx.cv.height = Math.round(sh * scale);
  zx.cv.getContext('2d', { willReadFrequently: true }).drawImage(v, sx, sy, sw, sh, 0, 0, zx.cv.width, zx.cv.height);
  try {
    const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(zx.cv)));
    const res = zx.reader.decode(bmp, zx.hints); return res ? res.getText() : null;
  } catch (e) { return null; }
}
async function startScanner() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { $('#scanIn').value = ''; $('#scanIn').click(); return; }
  $('#scanner').hidden = false; document.body.classList.add('lock');
  $('#scanMsg').textContent = 'Starting camera…';
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    stopScanner(); toast('Camera not available — use a photo instead');
    $('#scanIn').value = ''; $('#scanIn').click(); return;
  }
  const v = $('#scanVideo'); v.srcObject = scanStream;
  try { await v.play(); } catch (e) {}
  try { const t = scanStream.getVideoTracks()[0]; const caps = t.getCapabilities ? t.getCapabilities() : {}; if (caps.focusMode && caps.focusMode.includes('continuous')) await t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
  $('#scanMsg').textContent = 'Line the barcode up inside the box';
  let det = null;
  if ('BarcodeDetector' in window) { try { const sup = await BarcodeDetector.getSupportedFormats(); const fm = FORMATS.filter(f => sup.includes(f)); if (fm.length) det = new BarcodeDetector({ formats: fm }); } catch (e) { det = null; } }
  if (!det) await waitForZXing();
  const tick = async () => {
    if (!scanStream) return;
    if (v.readyState >= 2 && !scanBusy) {
      scanBusy = true; let code = null;
      try { if (det) { const r = await det.detect(v); if (r && r.length) code = r[0].rawValue; } else code = zxDecodeVideo(v); } catch (e) {}
      scanBusy = false;
      if (code && scanStream) { try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} stopScanner(); handleBarcode(code); return; }
    }
    scanTimer = setTimeout(tick, det ? 120 : 180);
  };
  tick();
}
function stopScanner() {
  clearTimeout(scanTimer);
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  $('#scanVideo').srcObject = null;
  $('#scanner').hidden = true;
  if ($('#sheet').hidden) document.body.classList.remove('lock');
}
$('#scanClose').onclick = stopScanner;
$('#scanPhoto').onclick = () => { stopScanner(); $('#scanIn').value = ''; $('#scanIn').click(); };
$('#scanType').onclick = () => { stopScanner(); openSheet(); viewScanFail(true); };
document.addEventListener('visibilitychange', () => { if (document.hidden && scanStream) stopScanner(); });

function viewScanFail(typing) {
  setSheet(sheetTop(typing ? 'Enter barcode' : 'Couldn’t read the barcode', true) + `
    <div class="note warn" ${typing ? 'hidden' : ''}>Tips: hold the phone 10–15 cm away, fill the frame with the barcode, keep it flat and well lit, and avoid glare.</div>
    <button class="tile primary wide" id="retry">Scan again</button>
    <div class="sec">Or type the number under the barcode</div>
    <div class="manual"><input id="mCode" inputmode="numeric" placeholder="e.g. 012345678905"><button id="mGo">Look up</button></div>
    <button class="link" id="mManual">Skip — enter the food manually</button>`);
  $('#backBtn').onclick = () => viewSearch();
  $('#retry').onclick = () => { closeSheet(); startScanner(); };
  $('#mGo').onclick = () => { const c = $('#mCode').value.trim(); if (c) handleBarcode(c); };
  $('#mManual').onclick = () => viewFoodForm({});
}
$('#scanIn').onchange = async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  openSheet(); loadingView('Reading barcode…');
  let code = null;
  try { code = await decodeBarcode(file); } catch (err) { console.warn(err); }
  if (code) handleBarcode(code); else viewScanFail();
};

/* ---------- backup ---------- */
function exportBackup() {
  const data = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('ct:')) data[k] = JSON.parse(localStorage.getItem(k)); } } catch (e) {}
  const blob = new Blob([JSON.stringify({ app: 'calorie-tracker', v: 1, exported: new Date().toISOString(), data })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `calorie-backup-${dkey(new Date())}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$('#importIn').onchange = async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (!j || j.app !== 'calorie-tracker' || !j.data) throw new Error();
    Object.entries(j.data).forEach(([k, v]) => { if (k.startsWith('ct:')) localStorage.setItem(k, JSON.stringify(v)); });
    toast('Backup restored'); setTimeout(() => location.reload(), 700);
  } catch (err) { toast('That isn’t a valid backup file'); }
};

/* ---------- boot ---------- */
(async () => {
  const st = await store.get('settings'); if (st) S.settings = { ...S.settings, ...st };
  const fd = await store.get('foods'); S.foods = (fd && fd.items) || {};
  await gotoDate(new Date());
})();
// keep "Today" right if the app stays open past midnight
let lastToday = dkey(new Date());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const t = dkey(new Date());
  if (t !== lastToday) { const wasToday = S.key === lastToday; lastToday = t; if (wasToday) gotoDate(new Date()); else render(); }
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
